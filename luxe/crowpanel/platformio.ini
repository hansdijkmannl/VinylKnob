[platformio]
default_envs = crowpanel

; Dit project staat op een exFAT-volume, en daar schrijft macOS voor elk
; bestand een "._naam" AppleDouble-sidecar naast. De compiler ziet die als
; broncode en struikelt erover. Vandaar de build-map op de interne schijf en
; het filter hieronder. Dat de bibliotheken ook daar landen is meegenomen:
; anders zou hetzelfde probleem via lib_deps terugkomen.
build_dir   = ${platformio.core_dir}/build/crowpanel
libdeps_dir = ${platformio.core_dir}/libdeps/crowpanel

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi     ; 8 MB PSRAM op de S3R8

; Het bord heeft 16 MB flash (nagemeten met esptool: manufacturer ba, device
; 4018). De bootloader leest zijn flashgrootte uit `upload.flash_size`, niet uit
; `build.flash_size` — dat laatste stond hier eerst en deed niets. Gevolg was
; een bootloader die dacht 8 MB te hebben met een partitietabel voor 16 MB
; eronder: hij vond partities voorbij het einde van de flash en herstartte,
; veertig keer per seconde, nog voordat er een regel firmware draaide.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

lib_deps =
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; De echte firmware: LVGL op het ronde paneel.
; ---------------------------------------------------------------------------
[env:crowpanel]
build_src_filter =
    +<*>
    -<._*>
    -<ui_serial.cpp>

; Arduino_GFX staat vastgepind op v1.3.1 en dat is geen voorzichtigheid maar
; noodzaak: vanaf v1.3.5 is de RGB-API herschreven (Arduino_RGB_Display in
; plaats van Arduino_ST7701_RGBPanel, timings verhuisd naar de busconstructor)
; en staat er in de type5-tabel een andere waarde in register 0x36. Elecrow's
; meegeleverde kopie is byte voor byte gelijk aan deze tag; dit is dus precies
; de code waarmee dit paneel aantoonbaar werkt.
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@8.4.0
    adafruit/Adafruit CST8XX Library@^1.1.1
    adafruit/Adafruit BusIO@^1.16.1
    bodmer/TJpg_Decoder@^1.1.0
    https://github.com/moononournation/Arduino_GFX.git#v1.3.1

build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; ---------------------------------------------------------------------------
; Zelfde firmware, maar met de seriële monitor als scherm. Handig om de
; bediening te volgen zonder dat het paneel in de weg zit, en als het paneel
; ooit stuk is.
;   pio run -e crowpanel-serial -t upload
; ---------------------------------------------------------------------------
[env:crowpanel-serial]
; Alleen de tekencode wisselt. board.cpp en hoes.cpp blijven meedoen omdat
; main.cpp de achtergrondverlichting en de hoes aanstuurt; het paneel wordt dus
; wel opgestart, er komt alleen niets op te staan.
build_src_filter =
    +<*>
    -<._*>
    -<ui_lvgl.cpp>

lib_deps = ${env:crowpanel.lib_deps}
build_flags = ${env:crowpanel.build_flags}
