<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="826" viewBox="0 0 1060 826" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2451f"/>
    </marker>
    <marker id="pijlgrijs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6a76"/>
    </marker>
    <style>
      .doos   { fill:#fff; stroke:#3a3a42; stroke-width:2; rx:10 }
      .naam   { font-size:17px; font-weight:600; fill:#1c1c22 }
      .sub    { font-size:13px; fill:#6a6a76 }
      .poort  { font-size:12px; fill:#3a3a42 }
      .kabel  { stroke:#c2451f; stroke-width:3; fill:none }
      .data   { stroke:#6a6a76; stroke-width:2; fill:none; stroke-dasharray:7 5 }
      .kop    { font-size:13px; font-weight:600; fill:#c2451f }
      .kopg   { font-size:13px; font-weight:600; fill:#6a6a76 }
      .titel  { font-size:22px; font-weight:700; fill:#1c1c22 }
      .let    { font-size:13px; fill:#3a3a42 }
      .letv   { font-size:13px; font-weight:600; fill:#1c1c22 }
      .mono   { font-size:12px; fill:#3a3a42; font-family:ui-monospace,Menlo,monospace }
    </style>
  </defs>

  <rect width="1060" height="826" fill="#fbfaf7"/>
  <text x="40" y="46" class="titel">MarantzKnob — bedrading</text>
  <text x="40" y="70" class="sub">Het CrowPanel heeft geen USB-C. Alles loopt via JST MX1.25-connectortjes van 4 polen.</text>

  <!-- stopcontact -->
  <rect x="40" y="270" width="96" height="76" class="doos"/>
  <text x="88" y="303" class="naam" text-anchor="middle">230 V</text>
  <text x="88" y="324" class="sub" text-anchor="middle">stopcontact</text>

  <!-- voeding -->
  <rect x="196" y="248" width="188" height="120" class="doos"/>
  <text x="290" y="280" class="naam" text-anchor="middle">InnoMaker 27 W</text>
  <text x="290" y="303" class="sub" text-anchor="middle">USB-C PD</text>
  <text x="290" y="330" class="letv" text-anchor="middle">5,1 V — 5 A</text>
  <text x="290" y="352" class="sub" text-anchor="middle">niet vervangen door 3 A</text>

  <line x1="140" y1="308" x2="192" y2="308" class="kabel" marker-end="url(#pijl)"/>

  <!-- Pi 5 -->
  <rect x="444" y="176" width="252" height="292" class="doos"/>
  <text x="570" y="208" class="naam" text-anchor="middle">Raspberry Pi 5 — 1 GB</text>
  <text x="570" y="229" class="sub" text-anchor="middle">OS Lite 64-bits, headless</text>

  <rect x="444" y="288" width="14" height="34" fill="#3a3a42"/>
  <text x="470" y="304" class="poort">USB-C  voeding in</text>
  <text x="470" y="320" class="sub">onderhandelt 5 V / 5 A</text>

  <rect x="682" y="252" width="14" height="34" fill="#2f6fb0"/>
  <text x="672" y="268" class="poort" text-anchor="end">USB-A</text>
  <text x="672" y="284" class="sub" text-anchor="end">→ CrowPanel</text>

  <rect x="682" y="368" width="14" height="34" fill="#3a3a42"/>
  <text x="672" y="384" class="poort" text-anchor="end">USB-A</text>
  <text x="672" y="400" class="sub" text-anchor="end">→ microfoon</text>

  <text x="570" y="440" class="sub" text-anchor="middle">40-pins header — zie alternatief onderaan</text>
  <text x="570" y="458" class="sub" text-anchor="middle">wifi → Shazam, Discogs, webinterface</text>

  <line x1="388" y1="308" x2="440" y2="305" class="kabel" marker-end="url(#pijl)"/>

  <!-- CrowPanel -->
  <rect x="780" y="188" width="240" height="166" class="doos"/>
  <text x="906" y="220" class="naam" text-anchor="middle">CrowPanel 2.1"</text>
  <text x="906" y="241" class="sub" text-anchor="middle">ESP32-S3, rond 480×480</text>
  <text x="906" y="268" class="letv" text-anchor="middle">~1 A bij vol licht</text>
  <text x="906" y="296" class="sub" text-anchor="middle">USB-5V-IN, UART en I2C</text>
  <text x="906" y="314" class="sub" text-anchor="middle">zitten alle drie op een</text>
  <text x="906" y="332" class="sub" text-anchor="middle">JST MX1.25 van 4 polen</text>
  <rect x="766" y="252" width="14" height="34" fill="#c2451f"/>

  <path d="M700,269 L762,269" class="kabel" marker-end="url(#pijl)"/>
  <text x="737" y="248" class="kop" text-anchor="middle">USB-5V-IN</text>

  <text x="900" y="378" class="letv" text-anchor="middle">USB-A → JST MX1.25, 4-polig</text>
  <text x="900" y="397" class="sub" text-anchor="middle">GND · D+ · D− · VCC</text>
  <text x="900" y="415" class="sub" text-anchor="middle">stroom én data, vier draden</text>

  <!-- microfoon -->
  <rect x="780" y="440" width="240" height="94" class="doos"/>
  <text x="900" y="472" class="naam" text-anchor="middle">USB-dasspeldmicrofoon</text>
  <text x="900" y="494" class="sub" text-anchor="middle">YFYWINSH, gewone USB-A</text>
  <text x="900" y="516" class="sub" text-anchor="middle">capsule los achter de opening</text>
  <rect x="766" y="470" width="14" height="34" fill="#3a3a42"/>

  <path d="M700,385 L734,385 L734,487 L762,487" class="kabel" marker-end="url(#pijl)"/>

  <!-- native USB -->
  <rect x="40" y="422" width="380" height="112" fill="#fff" stroke="#d8d8de" stroke-width="2" rx="10"/>
  <text x="60" y="450" class="letv">Het is echte USB, geen serieelbrug</text>
  <text x="60" y="474" class="mono">USB-D−  →  R43  →  GPIO19/USB_D−</text>
  <text x="60" y="494" class="mono">USB-D+  →  R44  →  GPIO20/USB_D+</text>
  <text x="60" y="518" class="sub">Geen CH340 of CP2102 op het bord: native USB van de S3.</text>

  <!-- stroombudget -->
  <rect x="40" y="560" width="490" height="132" fill="#fff" stroke="#e8a33d" stroke-width="2" rx="10"/>
  <text x="60" y="588" class="letv">Waarom die 27 W-adapter er echt toe doet</text>
  <text x="60" y="612" class="let">De Pi 5 begrenst zijn USB-poorten op <tspan class="letv">600 mA samen</tspan>. Te weinig</text>
  <text x="60" y="632" class="let">voor het CrowPanel alleen al. Die grens gaat pas naar <tspan class="letv">1,6 A</tspan></text>
  <text x="60" y="652" class="let">zodra de Pi met een PD-voeding <tspan class="letv">5 V bij 5 A</tspan> onderhandeld heeft.</text>
  <text x="60" y="676" class="sub">CrowPanel ~1000 mA + microfoon ~50 mA = ~1050 van de 1600 mA.</text>

  <!-- alternatief UART -->
  <rect x="556" y="560" width="464" height="132" fill="#fff" stroke="#d8d8de" stroke-width="2" rx="10"/>
  <text x="576" y="588" class="letv">Alternatief: de UART-connector op de 40-pins header</text>
  <text x="576" y="612" class="mono">CrowPanel UART      Pi 5 header</text>
  <text x="576" y="631" class="mono">5V   ────────────   pin 4   (5V)</text>
  <text x="576" y="650" class="mono">GND  ────────────   pin 6   (GND)</text>
  <text x="576" y="669" class="mono">RX   ────────────   pin 8   (TXD)      TX → pin 10 (RXD)</text>

  <!-- flashen -->
  <rect x="40" y="718" width="980" height="86" fill="#fff" stroke="#d8d8de" stroke-width="2" rx="10"/>
  <text x="60" y="746" class="letv">Flashen: houd BOOT ingedrukt</text>
  <text x="60" y="768" class="let">RESET en GPIO0 liggen op de 12-pins FPC, <tspan class="letv">niet</tspan> op de 4-polige USB-connector. Er is dus geen automatische reset.</text>
  <text x="60" y="788" class="let">Houd de BOOT-knop vast terwijl je de kabel insteekt, laat los, en upload.</text>
</svg>
