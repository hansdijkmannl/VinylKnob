[platformio]
default_envs = crowpanel

; This project lives on an exFAT volume, and there macOS writes a "._name"
; AppleDouble sidecar next to every file. The compiler sees those as source and
; trips over them. Hence the build directory on the internal disk and the filter
; below. The libraries landing there too is a bonus: otherwise the same problem
; would come back through lib_deps.
build_dir   = ${platformio.core_dir}/build/crowpanel
libdeps_dir = ${platformio.core_dir}/libdeps/crowpanel

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.arduino.memory_type = qio_opi     ; 8 MB PSRAM on the S3R8

; The board has 16 MB of flash (verified with esptool: manufacturer ba, device
; 4018). The bootloader reads its flash size from `upload.flash_size`, not from
; `build.flash_size` — the latter is what stood here first, and it did nothing.
; The result was a bootloader that believed it had 8 MB with a partition table
; for 16 MB underneath: it found partitions past the end of the flash and
; restarted, forty times a second, before a single line of firmware ran.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

lib_deps =
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; The real firmware: LVGL on the round panel.
; ---------------------------------------------------------------------------
[env:crowpanel]
build_src_filter =
    +<*>
    -<._*>
    -<ui_serial.cpp>

; Arduino_GFX is pinned to v1.3.1, and that is not caution but necessity: from
; v1.3.5 the RGB API was rewritten (Arduino_RGB_Display instead of
; Arduino_ST7701_RGBPanel, timings moved into the bus constructor) and the type5
; table carries a different value in register 0x36. Elecrow's bundled copy is
; byte for byte identical to this tag; this is therefore exactly the code this
; panel is known to work with.
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@8.4.0
    adafruit/Adafruit CST8XX Library@^1.1.1
    adafruit/Adafruit BusIO@^1.16.1
    bodmer/TJpg_Decoder@^1.1.0
    https://github.com/moononournation/Arduino_GFX.git#v1.3.1

build_flags =
    ${env.build_flags}
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; ---------------------------------------------------------------------------
; The same firmware, but with the serial monitor as the screen. Handy for
; following what you do without the panel in the way, and if the panel ever
; breaks.
;   pio run -e crowpanel-serial -t upload
; ---------------------------------------------------------------------------
[env:crowpanel-serial]
; Only the drawing code changes. board.cpp and artwork.cpp stay in, because
; main.cpp drives the backlight and the sleeve; the panel is started up, there
; is just nothing put on it.
build_src_filter =
    +<*>
    -<._*>
    -<ui_lvgl.cpp>

lib_deps = ${env:crowpanel.lib_deps}
build_flags = ${env:crowpanel.build_flags}
